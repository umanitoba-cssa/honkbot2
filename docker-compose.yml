services:
  honkbot:
    container_name: bot
    restart: always
    build:
      context: ./bot/
      dockerfile: ./Dockerfile
    depends_on:
      pocketbase-db:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - POCKETBASE_HOST=http://moderation-db:8080
      - POCKETBASE_EMAIL=${POCKETBASE_EMAIL}
      - POCKETBASE_PASSWORD=${POCKETBASE_PASSWORD}
      - MYSQL_HOST=message-db
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    networks:
      - bot-network

  pocketbase-db:
    container_name: moderation-db
    restart: always
    build:
      context: ./pocketbase-db/
      dockerfile: ./Dockerfile
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - ./pocketbase-db/data:/pb/pb_data
    environment:
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_EMAIL}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_PASSWORD}
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "--max-time", "5", "http://localhost:8080/api/health"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 3
      
  mysql:
    container_name: message-db
    restart: always
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: 'honkbot'
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
    command: --bind-address=0.0.0.0 --default-authentication-plugin=mysql_native_password
    volumes:
      - ./message-db/data:/var/lib/mysql
      - ./message-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "0.0.0.0:3306:3306"
    networks:
      - bot-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  bot-network:
    driver: bridge

